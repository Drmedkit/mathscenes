<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="data:,">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Math 7–8 Check-in</title>
  <link rel="stylesheet" href="./lesson.css">
  <style>
    main.check { max-width: 760px; margin: 0 auto; padding: 8px 24px 48px; }
    main.check .panel { min-height: 0; }
    .lead { color: var(--dim); max-width: 60ch; }
    .grades { display: flex; gap: 10px; flex-wrap: wrap; margin: 14px 0 6px; }
    .grades button.on { border-color: var(--s); background: #2a3a3a; }
    .q-board { display: block; margin: 12px 0 14px; max-width: 100%; height: auto; }
    .q-fig { margin: 8px 0 12px; } .q-fig svg { max-width: 100%; height: auto; }
    .panel .ans input { font-size: 22px; font-weight: 600; width: 96px; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 14px; }
    button.quiet { background: none; border-color: transparent; color: var(--dim); }
    .progress { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin: 4px 0 16px; }
    .progress i { display: block; height: 100%; background: var(--s); width: 0; transition: width .3s; }
        ol.res { list-style: none; padding: 0; margin: 8px 0 0; display: grid; gap: 4px; }
    ol.res li { display: grid; grid-template-columns: 26px 1fr auto; gap: 10px; align-items: center; padding: 6px 10px; border-radius: 10px; font-size: 15.5px; }
    ol.res li .n { color: var(--faint); text-align: right; }
    ol.res li .st { font-size: 13.5px; color: var(--faint); }
    ol.res li.mastered .st { color: var(--s); } ol.res li.notyet .st { color: var(--a); }
    ol.res li.here { background: var(--panel2); }
    ol.res a { color: var(--text); text-decoration: none; } ol.res a:hover { text-decoration: underline; }
    ul.mc { margin: 6px 0 0; padding-left: 20px; color: var(--dim); }
    .strands { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; margin: 12px 0 18px; }
    article.strand { border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; background: var(--panel); }
    article.strand h3 { margin: 0 0 10px; font-size: 16.5px; font-weight: 650; }
    article.strand p { margin: 8px 0 0; }
    article.strand p.go { font-size: 17px; } article.strand p.go a { color: var(--s); font-weight: 650; text-decoration: none; }
    article.strand p.go a:hover { text-decoration: underline; } article.strand p.done { color: var(--s); }
    ol.strip { list-style: none; display: flex; gap: 3px; padding: 0; margin: 0; }
    ol.strip li { flex: 1; height: 10px; border-radius: 3px; background: var(--line); }
    ol.strip li.got { background: var(--s); opacity: .6; } ol.strip li.likely { background: var(--s); opacity: .3; } ol.strip li.here { background: var(--a); }
    details.teacher { margin: 18px 0 0; } details.teacher p a { color: var(--s); } details.teacher summary { cursor: pointer; color: var(--dim); font-size: 15px; }
    details.teacher ol.res li { grid-template-columns: 26px 1fr auto auto; }
    ol.res li .sd { font-size: 13px; color: var(--faint); }
    @media (max-width: 560px) { article.strand { padding: 10px 12px; } .strands { grid-template-columns: 1fr; } details.teacher ol.res li { grid-template-columns: 22px 1fr; row-gap: 0; } ol.res li .sd { display: none; } ol.res li .st { grid-column: 2; } }
  </style>
</head>
<body>
  <header class="top"><h1><a class="home" href="./index.html" aria-label="All lessons">Math 7–8</a> · Check-in</h1></header>
  <main class="check"><section class="panel" id="panel" aria-live="polite"></section></main>
  <script type="module" src="./placement.ts"></script>
</body>
</html>
