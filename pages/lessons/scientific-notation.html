  <meta charset="utf-8">

  <title>Scientific Notation</title>
  <link rel="stylesheet" href="./lesson.css">
  <style>
    /* exponents in the panel */
    .panel sup { font-size: .72em; line-height: 0; position: relative; top: -.1em; }
    .cards button { font-size: 26px; }
    /* a scientific-notation answer: [a] x 10^[n], the exponent box raised like an exponent */
    .ans:has(.sci-op) input:nth-of-type(1) { width: 86px; }
    .ans:has(.sci-op) input:nth-of-type(2) { width: 56px; height: 38px; font-size: 18px; transform: translateY(-17px); margin-left: -6px; }
    .ans:has(.sci-op) .op { color: var(--text); }
    .ans .op { font-size: 20px; }
    /* one number box: room for 4500000000 or 0.0000304 */
    .panel .ans:not(:has(.sci-op)):not(:has(.stack)) input { width: 190px; text-align: left; padding: 0 12px; }
    .ans:has(.sci-op) input:nth-of-type(2) { border-color: var(--faint); }
    .opts button sup, .chips button sup { font-size: .7em; }
  </style>
</head>
